<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Rutas de la Salud</title>

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:
        'Segoe UI',
        sans-serif;
    }

    body{

      width:100%;
      min-height:100vh;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #111827,
          #1e293b
        );

      overflow:hidden;

    }

    .app-shell{

      width:100%;
      height:100vh;

      display:flex;
      flex-direction:column;

    }

    /* =========================
       HEADER
    ========================= */

    .topbar{

      width:100%;
      height:70px;

      background:
        rgba(15,23,42,.95);

      backdrop-filter:blur(12px);

      border-bottom:
        1px solid rgba(255,255,255,.08);

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 24px;

      z-index:100;

      box-shadow:
        0 4px 20px rgba(0,0,0,.25);

    }

    .brand{

      display:flex;
      align-items:center;
      gap:14px;

      color:white;

    }

    .brand-logo{

      width:48px;
      height:48px;

      border-radius:16px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #06b6d4
        );

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:22px;

      box-shadow:
        0 8px 18px rgba(37,99,235,.35);

    }

    .brand h1{

      font-size:20px;
      font-weight:700;

    }

    .brand span{

      font-size:12px;
      opacity:.7;

    }

    .topbar-actions{

      display:flex;
      align-items:center;
      gap:12px;

    }

    .status-pill{

      padding:10px 16px;

      border-radius:999px;

      background:
        rgba(16,185,129,.15);

      color:#10b981;

      font-size:13px;
      font-weight:600;

      border:
        1px solid rgba(16,185,129,.3);

    }

    .btn-open{

      border:none;
      outline:none;

      padding:12px 18px;

      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );

      color:white;

      font-weight:600;
      font-size:14px;

      cursor:pointer;

      transition:.25s ease;

      display:flex;
      align-items:center;
      gap:10px;

      box-shadow:
        0 10px 20px rgba(37,99,235,.35);

    }

    .btn-open:hover{

      transform:translateY(-2px);

    }

    /* =========================
       CONTENT
    ========================= */

    .content{

      flex:1;

      padding:18px;

      overflow:hidden;

    }

    .iframe-container{

      width:100%;
      height:100%;

      border-radius:24px;

      overflow:hidden;

      border:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(255,255,255,.04);

      box-shadow:
        0 20px 50px rgba(0,0,0,.35);

      position:relative;

    }

    iframe{

      width:100%;
      height:100%;

      border:none;

      background:white;

    }

    .loading-overlay{

      position:absolute;
      inset:0;

      background:
        linear-gradient(
          135deg,
          rgba(15,23,42,.95),
          rgba(30,41,59,.95)
        );

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      gap:20px;

      z-index:10;

      transition:.4s ease;

    }

    .spinner{

      width:72px;
      height:72px;

      border-radius:50%;

      border:
        6px solid rgba(255,255,255,.12);

      border-top:
        6px solid #3b82f6;

      animation:spin 1s linear infinite;

    }

    .loading-overlay h2{

      color:white;
      font-size:22px;

    }

    .loading-overlay p{

      color:rgba(255,255,255,.7);
      font-size:14px;

    }

    @keyframes spin{

      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:768px){

      .topbar{

        height:auto;

        padding:14px;

        flex-direction:column;
        align-items:flex-start;
        gap:14px;

      }

      .brand{

        width:100%;

      }

      .brand-logo{

        width:42px;
        height:42px;

        font-size:18px;

      }

      .brand h1{

        font-size:17px;

      }

      .topbar-actions{

        width:100%;

        flex-direction:column;

      }

      .status-pill,
      .btn-open{

        width:100%;
        justify-content:center;

      }

      .content{

        padding:10px;

      }

      .iframe-container{

        border-radius:18px;

      }

    }

  </style>

</head>
<body>

  <div class="app-shell">

    <!-- =========================
         TOPBAR
    ========================== -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-logo">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <div>

          <h1>Rutas de la Salud</h1>

          <span>
            Plataforma Integral de Validación
          </span>

        </div>

      </div>

      <div class="topbar-actions">

        <div class="status-pill">
          <i class="fa-solid fa-circle-check"></i>
          Sistema en línea
        </div>

        <button
          class="btn-open"
          onclick="abrirSistema()"
        >

          <i class="fa-solid fa-up-right-from-square"></i>
          Abrir en ventana completa

        </button>

      </div>

    </header>

    <!-- =========================
         CONTENT
    ========================== -->

    <main class="content">

      <div class="iframe-container">

        <div
          class="loading-overlay"
          id="loadingOverlay"
        >

          <div class="spinner"></div>

          <h2>
            Cargando sistema...
          </h2>

          <p>
            Preparando entorno seguro
          </p>

        </div>

        <!-- =========================
             CAMBIAR URL
        ========================== -->

        <iframe
          id="appFrame"
          src="https://script.google.com/macros/s/AKfycbygGpH7uLsDAXknO53PoGf3VmuJos81x7KJcJ4iehEUqlE_Ej2k7QhuOXRQ2MwIARpE/exec"
          allow="camera; microphone; fullscreen"
          loading="lazy"
        ></iframe>

      </div>

    </main>

  </div>

  <script>

    /* =========================
       LOADER
    ========================= */

    const frame =
      document.getElementById(
        'appFrame'
      );

    const overlay =
      document.getElementById(
        'loadingOverlay'
      );

    frame.onload = () => {

      setTimeout(() => {

        overlay.style.opacity = '0';

        overlay.style.pointerEvents = 'none';

      },900);

    };

    /* =========================
       ABRIR COMPLETO
    ========================= */

    function abrirSistema(){

      window.open(

        'https://script.google.com/macros/s/AKfycbygGpH7uLsDAXknO53PoGf3VmuJos81x7KJcJ4iehEUqlE_Ej2k7QhuOXRQ2MwIARpE/exec',

        '_blank'

      );

    }

  </script>

</body>
</html>
